name: ppu-linux-810-e2e

on:
  pull_request:
    branches:
      - v*
    paths:
      - '.github/workflows/ppu-linux-810-e2e.yml'
      - 'tests/e2e/**'
      - 'miles/**'
  push:
    branches:
      - v*
    paths:
      - '.github/workflows/ppu-linux-810-e2e.yml'
      - 'tests/e2e/**'
      - 'miles/**'
  workflow_dispatch:
    inputs:
      run_quick_start:
        description: 'Run the 2-card quick-start end-to-end case'
        required: false
        type: boolean
        default: true
      run_qwen35:
        description: 'Run the 8-card full training case (downloads and converts a 35B model first)'
        required: false
        type: boolean
        default: false
      qwen35_mode:
        description: 'Training mode (normal / debug_minimal)'
        required: false
        type: string
        default: 'normal'
      qwen35_extra_args:
        description: 'Extra arguments passed through to the training script (e.g. an aligned eval dataset)'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  # branch-scoped rolling tag: refreshed only on reviewed merges into
  # v0.1.2 (matches the build workflow's GITHUB_REF_NAME scheme), not the
  # cross-branch shared :miles pointer.
  IMAGE: ghcr.io/flytiger-eco/miles-for-sail:miles-v0.1.2
  NAMESPACE: ppu-sched
  HOST_VOLUMES: "/nas_aisw:/nas_aisw,/wl_nas:/mnt/wl_nas"
  SOURCE_DIR: /workspace/source
  NODE_SELECTOR: "board-type=OAM-810E"

defaults:
  run:
    shell: bash

jobs:
  quick-start-e2e:
    name: ppu-e2e quick-start (810E 2 cards)
    if: github.event_name != 'workflow_dispatch' || inputs.run_quick_start
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 240

    steps:
      - name: Checkout miles-for-sail
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait before retry (checkout)
        if: steps.checkout.outcome == 'failure'
        run: sleep 15

      - name: Checkout miles-for-sail (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "810 run quick-start end-to-end case"
        uses: flytiger-eco/shared-workflows/cluster-task@main
        with:
          nnodes: 0
          nproc_per_node: 2
          node_selector: ${{ env.NODE_SELECTOR }}
          host_volumes: ${{ env.HOST_VOLUMES }}
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          source_dir: ${{ env.SOURCE_DIR }}
          timeout_minutes: 180

          command: |
            bash <<'PPU_MILES_E2E'
            set -uo pipefail
            cd "${{ env.SOURCE_DIR }}"
            export PYTHONPATH="${PWD}:${PYTHONPATH:-}"
            # git in the pod sees the unpacked checkout as a foreign owner
            # ("dubious ownership", exit 128); tests that shell out to git
            # need this to pass.
            git config --global --add safe.directory "${PWD}" || true
            export HF_ENDPOINT=https://hf-mirror.com
            # Mirror downloads can fail mid-transfer with read timeouts; the
            # case downloads model and dataset itself and completed downloads
            # resume, so retry a bounded number of times before giving up.
            rc=1
            for attempt in 1 2 3; do
              if CUDA_VISIBLE_DEVICES=0,1 \
                 python3 tests/e2e/short/test_qwen2.5_0.5B_gsm8k_short.py; then
                rc=0
                break
              else
                rc=$?
              fi
              echo "[ppu-miles-e2e] attempt ${attempt} failed (exit=${rc}); retrying after a pause"
              sleep 30
            done
            echo "[ppu-miles-e2e] done (exit=${rc})"
            exit "${rc}"
            PPU_MILES_E2E

  qwen35-e2e:
    name: ppu-e2e qwen3.5-35b training (810E 8 cards)
    if: github.event_name != 'workflow_dispatch' || inputs.run_qwen35
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 420
    env:
      # PR/push events carry no dispatch inputs: default the mode so the
      # typer Literal never receives an empty string.
      Q35_MODE: ${{ inputs.qwen35_mode || 'normal' }}
      Q35_EXTRA_ARGS: ${{ inputs.qwen35_extra_args }}

    steps:
      - name: Checkout miles-for-sail
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait before retry (checkout)
        if: steps.checkout.outcome == 'failure'
        run: sleep 15

      - name: Checkout miles-for-sail (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "810 run qwen3.5-35b end-to-end training"
        uses: flytiger-eco/shared-workflows/cluster-task@main
        with:
          nnodes: 0
          nproc_per_node: 8
          node_selector: ${{ env.NODE_SELECTOR }}
          host_volumes: ${{ env.HOST_VOLUMES }}
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          source_dir: ${{ env.SOURCE_DIR }}
          timeout_minutes: 360

          command: |
            bash <<'PPU_MILES_E2E_TRAIN'
            set -uo pipefail
            cd "${{ env.SOURCE_DIR }}"
            git config --global --add safe.directory "${PWD}" || true
            export HF_ENDPOINT=https://hf-mirror.com
            # The cluster injects http_proxy/https_proxy into worker pods, but
            # miles' ray runtime_env only bypasses 127.0.0.1 in no_proxy. The
            # gated-launch activate POST targets the pod IP, so without this
            # override httpx routes it through the proxy -> 502 Bad Gateway.
            POD_IP=$(hostname -i | awk '{print $1}')
            # Hardware auto-detection only knows accelerator names listed in
            # the training utility; select an 8-card single-node topology
            # explicitly so model conversion and training agree on 8 ranks.
            args=(
              --hardware H200
              --parallelism tp1-ep8
              --rollout-max-response-len 8192
              --sglang-ep-size 8
              --sglang-max-running-requests 512
              --enable-eval
              --mode "${Q35_MODE}"
              --extra-env-vars "{\"no_proxy\":\"127.0.0.1,localhost,${POD_IP}\",\"NO_PROXY\":\"127.0.0.1,localhost,${POD_IP}\"}"
            )
            # Align the AIME eval prompts to the training prompt template before
            # eval. The recipe's prepare() downloads the raw datasets and its
            # eval_args points at the unaligned aime-2024.jsonl. Pre-download the
            # same datasets, wrap each AIME prompt with the template extracted
            # from dapo-math-17k, then override --eval-prompt-data through
            # extra_args (appended last by the recipe, so argparse last-wins).
            # The aligned file has a distinct name, so prepare()'s re-download
            # (cheap via the hf cache) leaves it intact.
            DATA_DIR=/root/datasets
            mkdir -p "${DATA_DIR}"
            hf download --repo-type dataset zhuzilin/dapo-math-17k --local-dir "${DATA_DIR}/dapo-math-17k"
            hf download --repo-type dataset zhuzilin/aime-2024 --local-dir "${DATA_DIR}/aime-2024"
            AIME_ALIGNED="${DATA_DIR}/aime-2024/aime-2024-aligned.jsonl"
            python3 scripts/tools/align_aime_prompt.py \
              --train "${DATA_DIR}/dapo-math-17k/dapo-math-17k.jsonl" \
              --test "${DATA_DIR}/aime-2024/aime-2024.jsonl" \
              --out "${AIME_ALIGNED}"
            if [[ ! -f "${AIME_ALIGNED}" ]]; then
              echo "[ppu-miles-e2e] AIME alignment failed: ${AIME_ALIGNED} not produced" >&2
              exit 1
            fi
            # CI-only dual workaround for the na131t development-driver
            # crashes (no repo source changes, applied at runtime):
            # (1) drop --overlap-cpu-optimizer-d2h-h2d — the param_copy_back
            # H2D crash reproduces with both deep_ep versions, so overlap is
            # the discriminating variable; (2) swap the flex (DeepEP) token
            # dispatcher for the alltoall dispatcher — the deep_ep Buffer
            # crash in forward comes from flex's fused dispatch/combine path.
            # This probes the overlap-off + deepep-off combination.
            sed -i 's/--moe-token-dispatcher-type flex /--moe-token-dispatcher-type alltoall /' scripts/run_qwen3_5_35b_a3b_mtp.py
            sed -i '/--overlap-cpu-optimizer-d2h-h2d/d' scripts/run_qwen3_5_35b_a3b_mtp.py
            grep -q -- '--moe-token-dispatcher-type alltoall ' scripts/run_qwen3_5_35b_a3b_mtp.py \
              || { echo "[ppu-miles-e2e] dispatcher sed failed to apply" >&2; exit 1; }
            if grep -q -- '--overlap-cpu-optimizer-d2h-h2d' scripts/run_qwen3_5_35b_a3b_mtp.py; then \
              echo "[ppu-miles-e2e] overlap sed failed to apply" >&2; exit 1; \
            fi
            echo "[ppu-miles-e2e] dual workaround applied: alltoall dispatcher + overlap off"
            # Short verification horizon: cap rollout steps at 5. extra_args is
            # appended last by the recipe, so this overrides the normal-mode
            # --num-rollout 3000 (argparse last-wins). Q35_EXTRA_ARGS still passes
            # through and can override further.
            args+=(--extra-args "--num-rollout 5 --eval-prompt-data aime ${AIME_ALIGNED} ${Q35_EXTRA_ARGS}")
            echo "[ppu-miles-e2e] launching training with: ${args[*]}"
            python3 scripts/run_qwen3_5_35b_a3b_mtp.py "${args[@]}"
            rc=$?
            echo "[ppu-miles-e2e-train] done (exit=${rc})"
            exit "${rc}"
            PPU_MILES_E2E_TRAIN
