name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Re-run the gates on review submissions and dismissals: the human gate
  # times out after 6h and cannot turn green on a late approve unless a
  # pull_request_review event restarts it (the reusable gate workflow is
  # designed for exactly this; dismissed refreshes revoked approvals).
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  precheck:
    name: Pre-check
    uses: flytiger-eco/.github/.github/workflows/user-precheck.yml@main

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: precheck
    uses: flytiger-eco/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  human-review:
    name: Human Review Gate
    needs: ai-code-review
    uses: flytiger-eco/.github/.github/workflows/human-review.yml@main
    secrets: inherit
